
parameters:
  - name: projectPath
    type: string
    default: 'EmployeePortal.Api/EmployeePortal.Api.csproj'

  - name: testProjectPath
    type: string
    default: 'EmployeePortal.Api.Tests/EmployeePortal.Api.Tests.csproj'

  - name: dotnetVersion
    type: string
    default: '8.x'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: ${{ parameters.dotnetVersion }}

  - script: dotnet restore ${{ parameters.projectPath }}
    displayName: 'Restore API dependencies'

  - script: >
      dotnet build ${{ parameters.projectPath }}
      --configuration Release
      --no-restore
    displayName: 'Build API'

  - script: >
      dotnet test ${{ parameters.testProjectPath }}
      --configuration Release
      --logger "trx"
      --results-directory $(Agent.TempDirectory)/TestResults
    displayName: 'Run unit tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
      failTaskOnFailedTests: true

  - script: >
      dotnet publish ${{ parameters.projectPath }}
      --configuration Release
      --no-restore
      --output $(Build.ArtifactStagingDirectory)/publish
    displayName: 'Publish API'

  - task: ArchiveFiles@2
    displayName: 'Create deployment ZIP'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/EmployeeApi.zip'
      replaceExistingArchive: true

  - publish: '$(Build.ArtifactStagingDirectory)/EmployeeApi.zip'
    artifact: drop
    displayName: 'Publish pipeline artifact'
