
trigger:
  branches:
    include:
      - development
      - qa
      - uat
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Build and test once
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAPI
        steps:
          - template: pipelines/templates/build.yml
            parameters:
              projectPath: 'src/Employee.Api/Employee.Api.csproj'
              testProjectPath: 'tests/Employee.Api.Tests/Employee.Api.Tests.csproj'
              dotnetVersion: '8.x'

  # Development
  - stage: Deploy_Dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/development'))
    jobs:
      - deployment: DeployDev
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: pipelines/templates/deploy.yml
                  parameters:
                    azureServiceConnection: 'SC-Development'
                    appName: 'employee-api-dev'

  # QA
  - stage: Deploy_QA
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/qa'))
    jobs:
      - deployment: DeployQA
        environment: 'QA'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: pipelines/templates/deploy.yml
                  parameters:
                    azureServiceConnection: 'SC-QA'
                    appName: 'employee-api-qa'

  # UAT
  - stage: Deploy_UAT
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/uat'))
    jobs:
      - deployment: DeployUAT
        environment: 'UAT'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: pipelines/templates/deploy.yml
                  parameters:
                    azureServiceConnection: 'SC-UAT'
                    appName: 'employee-api-uat'

  # Production
  - stage: Deploy_Production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: pipelines/templates/deploy.yml
                  parameters:
                    azureServiceConnection: 'SC-Production'
                    appName: 'employee-api-prod'
